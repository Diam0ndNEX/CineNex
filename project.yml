name: CineNex
options:
  bundleIdPrefix: com.diam0ndnex
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SwiftVLC:
    url: https://github.com/harflabs/SwiftVLC.git
    revision: 0ec31e4ecd31d08189b5aa64f86dc00f1434c978
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: CineNex
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: CineNex connects to peers and its local streaming server for torrent playback.
    OTHER_LDFLAGS: "$(inherited) -ObjC"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  CineNex:
    type: application
    platform: iOS
    sources:
      - path: CineNex
    dependencies:
      - package: SwiftVLC
        product: SwiftVLC
      - framework: Thirdparty/LibTorrent-Swift/Build/LibTorrent.xcframework
        embed: true
      - framework: Thirdparty/LibTorrent-Swift/Build/OpenSSL.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diam0ndnex.cinenex
        PRODUCT_NAME: CineNex
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CineNexTests
  CineNexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CineNexTests
    dependencies:
      - target: CineNex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diam0ndnex.cinenex.tests
