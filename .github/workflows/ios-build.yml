name: iOS Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cinenex-ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test native wrapper patcher
        run: python3 -m unittest discover -s Scripts/tests -v

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Apply native wrapper bridge
        run: python3 Scripts/patch_xitrix_piece_priority.py Thirdparty/LibTorrent-Swift

      - name: Fingerprint native dependencies and toolchain
        id: native-key
        shell: bash
        run: |
          native_fingerprint=$( { xcodebuild -version; printf '%s\n' "$ImageVersion"; git submodule status --recursive; } | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$native_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore native frameworks
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: Thirdparty/LibTorrent-Swift/Build
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-device-simulator-${{ steps.native-key.outputs.fingerprint }}-${{ hashFiles('Scripts/patch_xitrix_piece_priority.py', '.github/workflows/ios-build.yml') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: brew install cmake boost

      - name: Build patched XITRIX wrapper for iOS and simulator
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          export BOOST_ROOT="$(brew --prefix boost)"
          export BOOST_INCLUDEDIR="$BOOST_ROOT/include"
          test -f "$BOOST_INCLUDEDIR/boost/version.hpp"
          bash Thirdparty/LibTorrent-Swift/make.sh
          xcodebuild \
            -project Thirdparty/LibTorrent-Swift/LibTorrent.xcodeproj \
            -scheme LibTorrent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Thirdparty/LibTorrent-Swift/DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project Thirdparty/LibTorrent-Swift/LibTorrent.xcodeproj \
            -scheme LibTorrent \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Thirdparty/LibTorrent-Swift/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p Thirdparty/LibTorrent-Swift/Build
          xcodebuild -create-xcframework \
            -framework Thirdparty/LibTorrent-Swift/DerivedData/Build/Products/Release-iphoneos/LibTorrent.framework \
            -framework Thirdparty/LibTorrent-Swift/DerivedData/Build/Products/Release-iphonesimulator/LibTorrent.framework \
            -output Thirdparty/LibTorrent-Swift/Build/LibTorrent.xcframework
          xcodebuild -create-xcframework \
            -framework Thirdparty/LibTorrent-Swift/DerivedData/Build/Products/Release-iphoneos/OpenSSL.framework \
            -framework Thirdparty/LibTorrent-Swift/DerivedData/Build/Products/Release-iphonesimulator/OpenSSL.framework \
            -output Thirdparty/LibTorrent-Swift/Build/OpenSSL.xcframework

      - name: Save native frameworks before app compilation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Thirdparty/LibTorrent-Swift/Build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Cache Swift package downloads
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.fingerprint }}-${{ hashFiles('project.yml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          device_data = json.loads(result.stdout)
          devices = [
              device
              for runtime_devices in device_data.get("devices", {}).values()
              for device in runtime_devices
              if device.get("isAvailable", False)
              and device.get("name", "").startswith("iPhone")
          ]

          if not devices:
              print("No available iPhone simulator is installed on this runner.", file=sys.stderr)
              sys.exit(1)

          devices.sort(
              key=lambda device: (
                  0 if "Pro Max" in device["name"] else
                  1 if "Pro" in device["name"] else
                  2,
                  device["name"],
              )
          )
          selected = devices[0]
          print(f"Selected simulator: {selected['name']} ({selected['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"device_id={selected['udid']}\n")
              output.write(f"device_name={selected['name']}\n")
          PY

      - name: Run unit tests on available iPhone simulator
        run: |
          xcodebuild \
            -project CineNex.xcodeproj \
            -scheme CineNex \
            -clonedSourcePackagesDirPath SourcePackages \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            test

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project CineNex.xcodeproj \
            -scheme CineNex \
            -clonedSourcePackagesDirPath SourcePackages \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload CineNex-unsigned.ipa
          mkdir -p Payload
          cp -R DerivedDataDevice/Build/Products/Debug-iphoneos/CineNex.app Payload/CineNex.app
          ditto -c -k --sequesterRsrc --keepParent Payload CineNex-unsigned.ipa
          rm -rf Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineNex-unsigned-ipa
          path: CineNex-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
