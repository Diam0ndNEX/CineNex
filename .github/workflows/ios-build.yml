name: iOS Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: IPA only skips simulator builds and tests; full runs regression checks
        type: choice
        default: ipa_only
        options: [ipa_only, full]
      build_ipa:
        description: Build an installable unsigned IPA
        type: boolean
        default: false

concurrency:
  group: cinenex-ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tests: ${{ steps.plan.outputs.tests }}
      native_tests: ${{ steps.plan.outputs.native_tests }}
      ipa: ${{ steps.plan.outputs.ipa }}
      ipa_only: ${{ steps.plan.outputs.ipa_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CI build selection
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'ipa_only'
        run: python3 -m unittest discover -s Scripts/tests -p test_ci_build_plan.py -v
      - name: Choose checks from changed files
        id: plan
        run: python3 Scripts/ci_build_plan.py

  build-and-test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test native wrapper patcher
        if: needs.plan.outputs.native_tests == 'true'
        run: python3 -m unittest discover -s Scripts/tests -p 'test_patch_xitrix*.py' -v

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Apply native wrapper bridge
        run: |
          python3 Scripts/patch_xitrix_piece_priority.py Thirdparty/LibTorrent-Swift
          python3 Scripts/patch_xitrix_session_startup.py Thirdparty/LibTorrent-Swift

      - name: Fingerprint native dependencies and toolchain
        id: native-key
        shell: bash
        run: |
          native_fingerprint=$( { xcodebuild -version; printf '%s\n' "$ImageVersion"; git submodule status --recursive; } | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$native_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore native frameworks
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: Thirdparty/LibTorrent-Swift/Build
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.ipa_only == 'true' && 'device' || 'both' }}-${{ steps.native-key.outputs.fingerprint }}-${{ hashFiles('Scripts/patch_xitrix_piece_priority.py', 'Scripts/patch_xitrix_session_startup.py', 'Scripts/build_native_frameworks.sh') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: brew install cmake boost

      - name: Build patched XITRIX wrapper for iOS and simulator
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash Scripts/build_native_frameworks.sh "${{ needs.plan.outputs.ipa_only == 'true' && 'device' || 'both' }}"

      - name: Save native frameworks before app compilation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Thirdparty/LibTorrent-Swift/Build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Restore Swift package downloads
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: SourcePackages
          key: swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.fingerprint }}-${{ hashFiles('project.yml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare public account login configuration
        env:
          CINENEX_ANILIST_CLIENT_ID: ${{ vars.CINENEX_ANILIST_CLIENT_ID }}
          CINENEX_MAL_CLIENT_ID: ${{ vars.CINENEX_MAL_CLIENT_ID }}
          CINENEX_TRAKT_CLIENT_ID: ${{ vars.CINENEX_TRAKT_CLIENT_ID }}
          CINENEX_TRAKT_REDIRECT_URI: ${{ vars.CINENEX_TRAKT_REDIRECT_URI }}
          CINENEX_APP_TEAM_ID: ${{ vars.CINENEX_APP_TEAM_ID }}
        run: python3 Scripts/configure_account_logins.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -xcconfig Generated/OAuth.xcconfig -resolvePackageDependencies \
            -project CineNex.xcodeproj -scheme CineNex \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Save packages before compilation
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: SourcePackages
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Select an available iPhone simulator
        if: needs.plan.outputs.tests == 'true'
        id: simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          result = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          device_data = json.loads(result.stdout)
          devices = [
              device
              for runtime_devices in device_data.get("devices", {}).values()
              for device in runtime_devices
              if device.get("isAvailable", False)
              and device.get("name", "").startswith("iPhone")
          ]

          if not devices:
              print("No available iPhone simulator is installed on this runner.", file=sys.stderr)
              sys.exit(1)

          devices.sort(
              key=lambda device: (
                  0 if "Pro Max" in device["name"] else
                  1 if "Pro" in device["name"] else
                  2,
                  device["name"],
              )
          )
          selected = devices[0]
          print(f"Selected simulator: {selected['name']} ({selected['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"device_id={selected['udid']}\n")
              output.write(f"device_name={selected['name']}\n")
          PY

      - name: Run regression and navigation screenshot tests on available iPhone simulator
        if: needs.plan.outputs.tests == 'true'
        run: |
          xcodebuild -xcconfig Generated/OAuth.xcconfig \
            -project CineNex.xcodeproj \
            -scheme CineNex \
            -clonedSourcePackagesDirPath SourcePackages \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            test

      - name: Export simulator screenshots
        if: always() && needs.plan.outputs.tests == 'true' && hashFiles('TestResults.xcresult/Info.plist') != ''
        run: |
          xcrun xcresulttool export attachments --help
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult --output-path UIScreenshots

      - name: Upload simulator screenshots
        if: always() && needs.plan.outputs.tests == 'true' && hashFiles('UIScreenshots/**/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CineNex-simulator-screenshots
          path: UIScreenshots
          if-no-files-found: error
          retention-days: 7

      - name: Upload simulator test results
        if: always() && needs.plan.outputs.tests == 'true' && hashFiles('TestResults.xcresult/Info.plist') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CineNex-simulator-test-results
          path: TestResults.xcresult
          if-no-files-found: error
          retention-days: 7

      - name: Compile presentation changes
        if: needs.plan.outputs.tests != 'true' && needs.plan.outputs.ipa_only != 'true'
        run: |
          xcodebuild -xcconfig Generated/OAuth.xcconfig -project CineNex.xcodeproj -scheme CineNex \
            -clonedSourcePackagesDirPath SourcePackages \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned iOS app
        if: needs.plan.outputs.ipa == 'true'
        run: |
          xcodebuild -xcconfig Generated/OAuth.xcconfig \
            -project CineNex.xcodeproj \
            -scheme CineNex \
            -clonedSourcePackagesDirPath SourcePackages \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        if: needs.plan.outputs.ipa == 'true'
        run: |
          rm -rf Payload CineNex-unsigned.ipa
          mkdir -p Payload
          python3 Scripts/verify_built_app.py DerivedDataDevice/Build/Products/Debug-iphoneos/CineNex.app
          cp -R DerivedDataDevice/Build/Products/Debug-iphoneos/CineNex.app Payload/CineNex.app
          ditto -c -k --sequesterRsrc --keepParent Payload CineNex-unsigned.ipa
          rm -rf Payload

      - name: Upload unsigned IPA artifact
        if: needs.plan.outputs.ipa == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CineNex-unsigned-ipa
          path: CineNex-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
