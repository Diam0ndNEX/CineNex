name: Clean merged branches
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths: [.github/workflows/clean-merged-branches.yml]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete only branches fully contained in main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json, os, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          protected = {"main", "build/ipa"}
          page = 1
          while True:
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/pulls?state=open&per_page=100&page=" + str(page),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as response:
                  pulls = json.load(response)
              for pr in pulls:
                  protected.add(pr["base"]["ref"])
                  if pr["head"]["repo"] and pr["head"]["repo"]["full_name"] == os.environ["REPOSITORY"]:
                      protected.add(pr["head"]["ref"])
              if len(pulls) < 100:
                  break
              page += 1
          merged_heads = set()
          page = 1
          while True:
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/pulls?state=closed&per_page=100&page=" + str(page),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as response:
                  pulls = json.load(response)
              merged_heads.update(pr["head"]["sha"] for pr in pulls if pr["merged_at"])
              if len(pulls) < 100:
                  break
              page += 1
          git("fetch", "--prune", "origin", "+refs/heads/*:refs/remotes/origin/*")
          archive_heads = {"batch/provider-cancellation-hardening":"6896b7a90bed15f9c2338d002e1c5c106ac59204","batch/provider-cancellation-hardening-retry":"0a9015dc316a4accbfa129bdb0692a246f4203c3","batch/ready-provider-integrations":"08341280f27cbe375b8550d6b2a9a3b0ed998ef1","feature/anilist-anime-catalog":"375cf6adde2f3180bf73633d9364d0098c02d08b","feature/catalog-cache-freshness":"680cc7c920ba3912addaaec53f2df7f0652e5077","feature/clear-favorite-snapshots":"37b2a9f5e3cb10c0eff2bd7febb69ca89fec79ab","feature/continue-watching-management":"28c9bd69dfa393581ebc24b3e9b1c6d6650c53f0","feature/embed-player-retry":"803279b1c60a48559124033a2a6f3c8002daf898","feature/embed-provider-url-hardening":"91d3dace15884c71448bda5ff728923f9594f84d","feature/embedded-internet-archive-provider":"102e07f3349ac7495b03e15e4ba6e6091bb496b6","feature/episode-accessibility-labels":"802d60ed8c8c48041db019458dde209da20262c4","feature/hybrid-swiftvlc-avplayer":"c2258d6e2a5edf7c7017c4adc73e78074e796046","feature/in-app-data-privacy-details":"ebfb8064dd7c085468a92eeb333bdd1a649fd838","feature/letterboxd-export-filename":"5836c43412873a8ef0c25c89053b39c388ca0c00","feature/letterboxd-rating-validation-v2":"e4ef27de15a5e9909664c5f7c3eaac34c34bfa3a","feature/media-accessibility-summary":"ec036604f7e5a53a3a7a31f2da5189266f35be38","feature/offline-library-search-filters":"77587abdf379029641c9506a654aeba4ed974cd6","feature/playback-cleaner":"3d8e53062956baaaacc8819e4545cbd590383e2b","feature/playback-provider-timeouts":"c508de391e1e5a30b33d6cc6e4a43f3367ac35fa","feature/playback-source-url-scheme-validation":"bd55755480115de5d33bae4b491109815d6097d3","feature/scenebox-playhead-deadlines-clean":"7938bf1e723aebed09031da1eb7bcc1db5c15c3f","feature/scenebox-vlc-subtitle-settings":"c6a09e4b500968bbaf368d8560f124a2b832b378","feature/stremio-addon-protocol-client":"0c9513c89c761307c274c8ca107c90b74b5cd833","feature/stremio-playback-provider":"d0d8ab17ea6a929a27eb69470b952b082e64f45b","feature/stremio-redirect-hardening":"11f2e4843279520494c69edf7ab90dbea485ed6f","feature/stremio-torrent-descriptor":"d000461074d3c984658ec7e7c307bdcd2f65add7","feature/stremio-torrent-discovery":"6633b1d89fbcdbaafae439714addc1e9686dd857","feature/tmdb-recommendation-rating-validation":"b221a857d70fb1feeb9fad388c6d831515ee29bc","feature/torrent-engine-evaluation":"30af12cdd2d4235743216c933351be34526e3d24","feature/torrent-loopback-stream-server":"3e1de5329f0c4f1c58e45bcedf15f096f589c66e","feature/torrent-range-primitives":"5fe135bc6e7ff876e6c8e4cc1876eed028cd801e","feature/trakt-history-normalized-identifiers":"e0484c0b4fbeb573dcc95f30b0b5e582307860bd","feature/trakt-rating-display-label":"79d0c28ae32ebc273f298d0d05e75ac586f20277","feature/trakt-watchlist-normalized-identifiers":"af6e87144f4a563fa968d7f55df4e930c83bc9e8","feature/watch-hub-accessibility-labels":"18b72ed1f1fb656f6acb1fd305d5caf31a4dc7a5","feature/watch-hub-catalog-recommendations":"a00cb5f8dff06fba9e741ab8dfdb3f7936e692c8","feature/watch-hub-title-accessibility":"bd1a56bdfc5fd1ab0f1e3570713dafdaeb5e4c3f","feature/xitrix-piece-priority-bridge":"31285e66a4c26e12cfa74512bab2fd3d534fa04b","fix/archive-provider-cancellation":"2dfcd4568c0c8124e6eed2a23fde9e6c28e60832","fix/offline-download-path-confinement":"d588308e9dff6c89686f58733496fb71a0288f06","fix/playback-coordinator-cancellation":"fd56b6b568602b8ae9ce4a5bd550bf0c2289a50c","fix/poster-image-url-validation-v2":"d6ef115963a128d06d9d81d6092411d9b3751ce3","fix/short-media-playback-progress":"03a6145525bb0da320dbcbbc8107d67f49e3244e","integration/native-torrent-and-xitrix-build":"b73afd58d92ea8dbbbd92e90d7857950aa4fdea2","integration/native-torrent-provider-foundation":"50f705201bf2c216c97a9457567818ed37c9eb90","integration/torrent-streaming-foundation":"474a674e8fb8a4320f9bec38ced2ed1716fe717e","test/playback-source-edge-cases":"7a66fd202065151a242d8222c0146ca570fa187d","validation/scenebox-deadline-fix-92":"9df373e79fa232a17d5d3b9931c073623a1f1ad1","validation/scenebox-deadline-full-stack":"fa3bf9ab54d36eedf2a73d3df138746a042a3155","validation/scenebox-startup-priority-91":"5814ad1d1ae4ceec2bee231b8c5c935c93db44b1"}
          for name, sha in archive_heads.items():
              if name in protected:
                  continue
              ref = "refs/remotes/origin/" + name
              current = subprocess.run(["git", "rev-parse", "--verify", ref], capture_output=True, text=True)
              if current.returncode != 0 or current.stdout.strip() != sha:
                  print("Skipped archive because branch is absent or changed:", name)
                  continue
              tag = "refs/tags/archive/2026-10-26/" + name
              result = subprocess.run(["git", "push", "--atomic", "--force-with-lease=refs/heads/" + name + ":" + sha,
                                       "origin", sha + ":" + tag, ":refs/heads/" + name], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit("Archive transaction refused for " + name)
              print("Archived branch:", name, sha, tag)
          git("fetch", "--prune", "origin", "+refs/heads/*:refs/remotes/origin/*")
          main = git("rev-parse", "refs/remotes/origin/main")
          deleted, retained, failed = [], [], []
          for line in git("for-each-ref", "--format=%(refname) %(objectname)", "refs/remotes/origin/").splitlines():
              ref, sha = line.split()
              name = ref.removeprefix("refs/remotes/origin/")
              if name == "HEAD" or name in protected:
                  continue
              if sha not in merged_heads and subprocess.run(["git", "merge-base", "--is-ancestor", sha, main]).returncode != 0:
                  retained.append(name)
                  continue
              result = subprocess.run(["git", "push", "--force-with-lease=refs/heads/" + name + ":" + sha,
                                       "origin", ":refs/heads/" + name], capture_output=True, text=True)
              if result.returncode == 0:
                  deleted.append(name)
                  print("Deleted merged branch:", name, sha)
              else:
                  failed.append(name)
                  print("Kept branch after deletion was refused:", name)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Branch cleanup\nDeleted: " + str(len(deleted)) + "\n\n")
              summary.write("\n".join("- Deleted: " + n for n in deleted))
              summary.write("\n\n" + "\n".join("- Retained unique work: " + n for n in retained))
              summary.write("\n\n" + "\n".join("- Deletion refused: " + n for n in failed))
          if failed:
              raise SystemExit("Some branch deletions were refused; see the summary.")
